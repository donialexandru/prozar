services:
  image: ghcr.io/donialexandru/prozar:latest
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-node-app
    container_name: my-node-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENC=production
    restart: unless-stopped
